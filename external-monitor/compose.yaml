services:
  insight-probe:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - probe-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
volumes:
  probe-data:

