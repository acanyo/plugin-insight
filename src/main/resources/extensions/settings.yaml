apiVersion: v1alpha1
kind: Setting
metadata:
  name: insight-settings
spec:
  forms:
    - group: collection
      label: 数据采集
      formSchema:
        - $formkit: number
          name: samplingSeconds
          label: 采样间隔（秒）
          value: 15
          min: 5
          max: 300
          validation: required|min:5|max:300
        - $formkit: number
          name: systemRetentionDays
          label: 15 秒系统指标保留天数
          value: 7
          min: 1
          max: 30
          validation: required|min:1|max:30
        - $formkit: number
          name: aggregateRetentionDays
          label: 分钟聚合保留天数
          value: 30
          min: 7
          max: 180
          validation: required|min:7|max:180
        - $formkit: number
          name: eventRetentionDays
          label: 事件和告警保留天数
          value: 30
          min: 7
          max: 365
          validation: required|min:7|max:365
        - $formkit: number
          name: slowRequestMillis
          label: 慢请求阈值（毫秒）
          value: 1000
          min: 100
          max: 60000
          validation: required|min:100|max:60000
        - $formkit: number
          name: maxDatabaseMegabytes
          label: 数据库容量上限（MB）
          value: 512
          min: 64
          max: 4096
          validation: required|min:64|max:4096
        - $formkit: switch
          name: pluginResourceSamplingEnabled
          id: pluginResourceSamplingEnabled
          key: pluginResourceSamplingEnabled
          label: 启用插件资源归因采样
          help: 使用有界线程采样估算插件 CPU 与分配内存；共享线程池不会强行归属
          value: true
        - $formkit: number
          name: pluginResourceMaxThreads
          id: pluginResourceMaxThreads
          key: pluginResourceMaxThreads
          label: 插件资源采样线程上限
          help: 每轮最多读取的线程计数器数量，超过上限会降低置信度
          value: 512
          min: 32
          max: 2048
          if: "$get(pluginResourceSamplingEnabled).value === true"
          validation: required|min:32|max:2048
    - group: alerts
      label: 告警规则
      formSchema:
        - $formkit: checkbox
          name: advancedEnabled
          label: 启用近期 GC、堆增长、插件持续消耗、依赖和业务任务告警
          value: true
          help: 采样不足时不会判断恢复。业务任务包含最近一小时失败备份、运行超过 30 分钟的备份及就绪队列达到 100 的线程池。
        - $formkit: number
          name: gcWarningPercent
          label: 最近 5 分钟 GC 时间占比阈值（%）
          value: 10
          min: 1
          max: 100
          validation: required|min:1|max:100
        - $formkit: switch
          name: enabled
          label: 启用告警
          value: true
        - $formkit: number
          name: durationSeconds
          label: 持续时间（秒）
          value: 60
          min: 15
          max: 3600
          validation: required|min:15|max:3600
        - $formkit: number
          name: cooldownMinutes
          label: 重复通知抑制（分钟）
          value: 30
          min: 1
          max: 1440
          validation: required|min:1|max:1440
        - $formkit: number
          name: cpuWarningPercent
          label: CPU 使用率阈值（%）
          value: 85
          min: 1
          max: 100
          validation: required|min:1|max:100
        - $formkit: number
          name: heapWarningPercent
          label: JVM 堆使用率阈值（%）
          value: 85
          min: 1
          max: 100
          validation: required|min:1|max:100
        - $formkit: number
          name: diskWarningPercent
          label: 磁盘使用率阈值（%）
          value: 90
          min: 1
          max: 100
          validation: required|min:1|max:100
        - $formkit: number
          name: errorRatePercent
          label: 请求错误率阈值（%）
          value: 5
          min: 0.1
          max: 100
          step: 0.1
          validation: required|min:0.1|max:100
        - $formkit: number
          name: p95WarningMillis
          label: P95 响应时间阈值（毫秒）
          value: 1500
          min: 100
          max: 60000
          validation: required|min:100|max:60000
    - group: notifications
      label: 通知渠道
      formSchema:
        - $formkit: userSelect
          name: haloNotificationRecipients
          id: haloNotificationRecipients
          key: haloNotificationRecipients
          label: Halo 通知接收用户
          help: Halo 会按用户通知偏好发送站内通知和邮件；邮件服务器请在 Halo 系统设置中配置；可多选，清空后不发送通知
          multiple: true
          clearable: true
          value: []
        - $formkit: switch
          name: webhookEnabled
          id: webhookEnabled
          key: webhookEnabled
          label: 启用出站 Webhook
          help: 将运行洞察告警发送到飞书、钉钉或自建接口
          value: false
        - $formkit: text
          name: webhookUrl
          id: webhookUrl
          key: webhookUrl
          label: 出站 Webhook 地址
          placeholder: https://example.com/insight/webhook
          value: ""
          if: "$get(webhookEnabled).value === true"
          validation: url
        - $formkit: password
          name: webhookSecret
          id: webhookSecret
          key: webhookSecret
          label: 出站 Webhook 签名密钥
          value: ""
          if: "$get(webhookEnabled).value === true"
        - $formkit: switch
          name: webhookAllowPrivateNetwork
          id: webhookAllowPrivateNetwork
          key: webhookAllowPrivateNetwork
          label: 允许 Webhook 访问私有网络
          help: 默认仅允许 HTTPS 公网地址；仅在信任目标且确实需要访问内网时开启
          value: false
          if: "$get(webhookEnabled).value === true"
