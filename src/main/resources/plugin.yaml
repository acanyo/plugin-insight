# Refer https://docs.halo.run/developer-guide/plugin/basics/manifest

apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  # The name defines how the plugin is invoked, A unique name
  name: insight
spec:
  enabled: true
  requires: ">=2.26.0"
  version: "1.0.0"
  author:
    name: Handsome
    website: https://github.com/acanyo
  logo: logo.svg
  homepage: https://github.com/acanyo/plugin-insight#readme
  repo: https://github.com/acanyo/plugin-insight
  issues: https://github.com/acanyo/plugin-insight/issues
  displayName: "运行洞察"
  description: "Halo 运行洞察：提供总览、CPU/内存/JVM/请求监控、全部插件资源排行、性能诊断、告警与事件时间线、Halo/Webhook 通知，以及一键生成 Issue 反馈。"
  settingName: insight-settings
  configMapName: insight-configmap
  license:
    - name: "GPL-3.0"
      url: "https://github.com/acanyo/plugin-insight/blob/main/LICENSE"
